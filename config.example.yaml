# Screenshot Tool configuration. The persistent service reloads this for every request.
wayland_capture: wayland-capture
output_dir: ~/Pictures/screenshots
default_format: png
default_quality: 90
enable_clipboard: true
enable_notification: true
enable_sound: true
include_window_title: false

# Runtime captures used by --silent default below $XDG_RUNTIME_DIR.
# silent_output_dir:

